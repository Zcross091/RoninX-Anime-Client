name: Build and Deploy RoninX Anime Android App

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================
  # Job 1: Build Android Application (APK)
  # =============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoninX-Anime-Client-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  # =============================================================
  # Job 2: Create GitHub Release
  # =============================================================
  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: RoninX-Anime-Client-Android-APK
          path: ./release-assets/

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "title=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Latest Development Build" >> $GITHUB_OUTPUT
          fi

      - name: Update Latest Git Tag
        if: steps.vars.outputs.tag == 'latest'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push -f origin latest

      - name: Refresh Release Timestamp
        if: steps.vars.outputs.tag == 'latest'
        run: |
          gh release delete latest --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          body: |
            This release contains the latest automated build of the RoninX Anime Android App.
            
            **Triggered by:** ${{ github.event.head_commit.message }}
            **Commit:** ${{ github.sha }}
          files: |
            ./release-assets/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
