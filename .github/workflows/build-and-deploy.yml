name: Build and Deploy RoninX Anime Android App

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================
  # Job 1: Build Android Application (APK)
  # =============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoninX-Anime-Client-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  # =============================================================
  # Job 2: Create GitHub Release
  # =============================================================
  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: RoninX-Anime-Client-Android-APK
          path: ./release-assets/

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0")
            if [[ $RAW_VERSION == v* ]]; then
              BASE_TAG="${RAW_VERSION}"
            else
              BASE_TAG="v${RAW_VERSION}"
            fi

            if git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
              SHORT_SHA=$(git rev-parse --short HEAD)
              TAG_NAME="${BASE_TAG}-${SHORT_SHA}"
            else
              TAG_NAME="${BASE_TAG}"
            fi
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=RoninX Anime ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create and Push Git Tag
        run: |
          TAG_NAME="${{ steps.vars.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG_NAME}" ${{ github.sha }}
          git push -f origin "${TAG_NAME}" || true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          body: |
            Automated Release for RoninX Anime Android App (${{ steps.vars.outputs.tag }}).
            
            **Triggered by:** ${{ github.event.head_commit.message }}
            **Commit:** ${{ github.sha }}
          files: |
            ./release-assets/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
